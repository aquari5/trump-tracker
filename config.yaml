# Ustawienia trackera. Hasła i klucze NIE trafiają tutaj – ustawiasz je jako
# "Secrets" w GitHubie (patrz README.md).

email:
  # Gmail: smtp.gmail.com / 587. iCloud: smtp.mail.me.com / 587.
  smtp_host: smtp.gmail.com
  smtp_port: 587
  timezone: Europe/Warsaw

analysis:
  # Dostawcy AI, próbowani po kolei: jeśli pierwszy nie odpowiada, tracker bierze następnego.
  # Kolejność od najlepszego modelu: Gemini 3 Flash, potem Groq (gpt-oss-120b), potem lżejsze zapasowe.
  # Przy awarii lub limicie tracker od razu przechodzi do następnego.
  # Dostawca bez ustawionego klucza (sekret w GitHubie) jest pomijany.
  # Wystarczy dowolny klucz, ale im więcej, tym mniejsza szansa, że wszystkie padną naraz.
  providers:
    - name: gemini                     # darmowy klucz: aistudio.google.com/apikey
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      key_env: GEMINI_API_KEY
      model: gemini-3-flash-preview      # sprawdzone 20.10.2026: odpowiada w 1-2 s
    - name: groq                       # darmowy klucz: console.groq.com/keys
      base_url: https://api.groq.com/openai/v1
      key_env: GROQ_API_KEY
      model: openai/gpt-oss-120b
      extra_body:
        reasoning_effort: low
    - name: gemini-lite
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      key_env: GEMINI_API_KEY
      model: gemini-3.1-flash-lite
    - name: nvidia                     # katalog NVIDII bywa niestabilny (modele znikają)
      base_url: https://integrate.api.nvidia.com/v1
      key_env: NVIDIA_API_KEY
      model: nvidia/nemotron-3.5-lightning-30b-a3b
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
    - name: nvidia-2
      base_url: https://integrate.api.nvidia.com/v1
      key_env: NVIDIA_API_KEY
      model: nvidia/nemotron-3-ultra-550b-a55b
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  # 5 = konkretna decyzja/inwestycja dot. nazwanej spółki, 4 = mocna pochwała/atak na spółkę
  # albo nowe cło/zakaz/dotacja dla branży, 3 = ogólne gadanie o branży.
  # Mail przychodzi tylko dla wpisów z oceną >= tej wartości.
  min_importance: 4
  # Ile ostatnich wpisów przeanalizować przy pierwszym uruchomieniu (mail powitalny).
  welcome_items: 15

# Źródła wypowiedzi. Każde RSS można dodać jako type: rss.
sources:
  - key: truth
    name: Trump – Truth Social
    type: truth_rss
    url: https://www.trumpstruth.org/feed
  - key: wh
    name: Biały Dom – decyzje prezydenta
    type: rss
    url: https://www.whitehouse.gov/presidential-actions/feed/
  # Przemówienia i oświadczenia (Trump, JD Vance, ministrowie).
  - key: wh-remarks
    name: Biały Dom – przemówienia
    type: rss
    url: https://www.whitehouse.gov/remarks/feed/
  - key: wh-statements
    name: Biały Dom – oświadczenia
    type: rss
    url: https://www.whitehouse.gov/briefings-statements/feed/

# Transakcje giełdowe członków Izby Reprezentantów (STOCK Act).
# Transakcje są zapisywane po cichu i pojawiają się w niedzielnym podsumowaniu (bez osobnych maili).
trades:
  enabled: true
  # Nazwiska (wystarczy samo nazwisko).
  watchlist:
    - Pelosi      # Nancy Pelosi – najsłynniejsze transakcje w Kongresie, opcje na big tech
    - Gottheimer  # Josh Gottheimer – bardzo aktywny, opcje (np. Microsoft)
    - Fields      # Cleo Fields – jeden z najaktywniejszych w 2026, opcje na big tech
    - Donalds     # Byron Donalds – kandydat Trumpa na gubernatora Florydy, aktywny inwestor
  # false = pokazuj też transakcje wszystkich innych członków Izby powyżej min_amount.
  only_watchlist: true
  min_amount: 15001
  # Max liczba zgłoszeń (PDF) przetwarzanych w jednym przebiegu.
  max_filings_per_run: 60

weekly:
  # Z ilu ostatnich dni liczyć wyniki w niedzielnym podsumowaniu.
  lookback_days: 365
