name: Tracker

on:
  schedule:
    - cron: "*/30 * * * *"   # wypowiedzi: co 30 minut
    - cron: "15 13 * * *"    # transakcje Kongresu: sprawdzane codziennie, mail tylko gdy coś jest
    - cron: "0 7 * * 0"      # podsumowanie: niedziela 07:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: Co uruchomić
        type: choice
        options: [test-email, alerts, trades, weekly]
        default: test-email

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Until the email secrets exist, scheduled runs are skipped instead of failing every
      # 30 minutes. A manual run still fails, so a test shows what is missing.
      - name: Check secrets
        id: secrets
        env:
          EVENT: ${{ github.event_name }}
          READY: ${{ secrets.SMTP_USER != '' && secrets.SMTP_PASSWORD != '' && secrets.EMAIL_TO != '' }}
        run: |
          if [ "$READY" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "schedule" ]; then
            echo "::notice::Brak sekretów SMTP_USER / SMTP_PASSWORD / EMAIL_TO – pomijam to uruchomienie."
          else
            echo "::error::Brak sekretów SMTP_USER / SMTP_PASSWORD / EMAIL_TO (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-python@v6
        if: steps.secrets.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.secrets.outputs.ready == 'true'

      - name: Run tracker
        if: steps.secrets.outputs.ready == 'true'
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          case "$SCHEDULE" in
            "15 13 * * *") mode=trades ;;
            "0 7 * * 0")   mode=weekly ;;
            "")            mode="${MANUAL_MODE:-alerts}" ;;
            *)             mode=alerts ;;
          esac
          python -m tracker "$mode"

      - name: Save state
        if: steps.secrets.outputs.ready == 'true'
        run: |
          [ -d data ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update tracker state"
            git pull --rebase
            git push
          fi
