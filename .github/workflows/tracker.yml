name: Tracker

on:
  schedule:
    - cron: "7,37 * * * *"   # co 30 min: wypowiedzi zawsze; transakcje raz na dobę; podsumowanie w niedzielę
  workflow_dispatch:
    inputs:
      mode:
        description: Co uruchomić
        type: choice
        options: [auto, test-email, alerts, trades, weekly]
        default: auto

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Until the email secrets exist, scheduled runs are skipped instead of failing every
      # 30 minutes. A manual run still fails, so a test shows what is missing.
      - name: Check secrets
        id: secrets
        env:
          EVENT: ${{ github.event_name }}
          READY: ${{ secrets.SMTP_USER != '' && secrets.SMTP_PASSWORD != '' && secrets.EMAIL_TO != '' }}
        run: |
          if [ "$READY" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "schedule" ]; then
            echo "::notice::Brak sekretów SMTP_USER / SMTP_PASSWORD / EMAIL_TO – pomijam to uruchomienie."
          else
            echo "::error::Brak sekretów SMTP_USER / SMTP_PASSWORD / EMAIL_TO (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-python@v6
        if: steps.secrets.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.secrets.outputs.ready == 'true'

      - name: Run tracker
        if: steps.secrets.outputs.ready == 'true'
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          # Scheduled runs (and external triggers) use "auto": statements every time, trades and
          # the Sunday summary whenever they are due, so a skipped cron slot loses nothing.
          if [ -n "$SCHEDULE" ]; then mode=auto; else mode="${MANUAL_MODE:-auto}"; fi
          python -m tracker "$mode"

      - name: Save state
        if: steps.secrets.outputs.ready == 'true'
        run: |
          [ -d data ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update tracker state"
            # GitHub occasionally rejects a push with a transient server error; retry before failing.
            for attempt in 1 2 3 4 5; do
              git pull --rebase && git push && exit 0
              echo "Push attempt $attempt failed, retrying in $((attempt * 10))s"
              sleep $((attempt * 10))
            done
            exit 1
          fi
